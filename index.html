<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kraken Depot">
<meta name="theme-color" content="#0d1017">
<title>Kraken Depot</title>
<style>

:root{--bg:#0d1017;--card:#151a24;--line:#232b3a;--tx:#e6eaf2;--mut:#8b95a8;--up:#26c281;--dn:#ef5350;--acc:#f5b942;--blue:#5b8def}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(13,16,23,.95);z-index:5;backdrop-filter:blur(6px)}
h1{font-size:18px;margin:0;font-weight:650}
h1 span{color:var(--mut);font-weight:400;font-size:12px;margin-left:8px}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button,select{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer}
button:hover{border-color:var(--blue)}
main{padding:20px 24px;max-width:1500px;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .l{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:24px;font-weight:650;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{color:var(--mut);font-size:12px;margin-top:2px}
.up{color:var(--up)}.dn{color:var(--dn)}
.row{display:grid;grid-template-columns:300px 1fr;gap:12px;margin-bottom:14px}
.row2{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:14px}
@media(max-width:900px){.row{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.panel h2{font-size:13px;margin:0 0 10px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:right;color:var(--mut);font-weight:500;font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{text-align:right;padding:7px 8px;border-bottom:1px solid #1b2230;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
tr.clk{cursor:pointer}tr.clk:hover td{background:#1a2130}
tfoot td{font-weight:650;border-top:1px solid var(--line);border-bottom:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(520px,1fr));gap:12px}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;scroll-margin-top:80px}
.card .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.card .t{font-weight:650;font-size:16px}
.card .t small{color:var(--mut);font-weight:400;font-size:12px;margin-left:6px}
.card .pl{font-weight:650;font-variant-numeric:tabular-nums}
.stats{display:flex;gap:14px;flex-wrap:wrap;color:var(--mut);font-size:12px;margin:4px 0 8px;font-variant-numeric:tabular-nums}
.stats b{color:var(--tx);font-weight:550}
.ch{height:290px;position:relative}
.tx{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.tx summary{cursor:pointer;color:var(--mut);font-size:12px;margin-bottom:6px}
.tx .sc{max-height:300px;overflow:auto}
.tx table{font-size:12px}.tx th{position:sticky;top:0;background:var(--card)}
.tx td,.tx th{padding:4px 5px}.tx th{white-space:normal;vertical-align:bottom;line-height:1.25}
.tx tfoot td{position:sticky;bottom:0;background:var(--card)}
.msg{color:var(--mut);padding:40px 0;text-align:center}
.err{color:var(--dn);font-size:12px;padding:6px 0}
.leg{display:flex;gap:14px;color:var(--mut);font-size:12px;margin-top:6px;flex-wrap:wrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
.note{color:var(--mut);font-size:12px;margin-top:18px;line-height:1.65}
#donut{display:block;margin:0 auto}
.lg{margin-top:10px;font-size:12px}
.lg div{display:flex;justify-content:space-between;padding:2px 0}
.ch2{height:220px}

nav{display:flex;gap:6px}
.card,.panel,.grid>*,.row>*,.kpi{min-width:0}
main{overflow-x:hidden}
html[data-theme=tokio]{--bg:#16161e;--card:#1a1b26;--line:#2f3549;--tx:#c0caf5;--mut:#7f89b5;--up:#9ece6a;--dn:#f7768e;--acc:#e0af68;--blue:#7aa2f7}
html[data-theme=tokio] body{background:radial-gradient(1200px 500px at 85% -10%,rgba(187,154,247,.16),transparent 60%),radial-gradient(900px 500px at 0% 0%,rgba(125,207,255,.10),transparent 55%),var(--bg);background-attachment:fixed}
html[data-theme=tokio] .card,html[data-theme=tokio] .panel,html[data-theme=tokio] .kpi{border-color:#2f3549;box-shadow:0 0 0 1px rgba(122,162,247,.06),0 8px 30px rgba(0,0,0,.35)}
html[data-theme=tokio] .kpi .v{text-shadow:0 0 18px rgba(122,162,247,.35)}
html[data-theme=tokio] h1{background:linear-gradient(90deg,#7aa2f7,#bb9af7,#f7768e);-webkit-background-clip:text;background-clip:text;color:transparent}
html[data-theme=tokio] h1 span{color:var(--mut);-webkit-text-fill-color:var(--mut)}
html[data-theme=tokio] nav button.on,html[data-theme=tokio] .tb button.on{border-color:#bb9af7;background:#292e42;box-shadow:0 0 12px rgba(187,154,247,.35)}
html[data-theme=tokio] header{background:rgba(22,22,30,.9)}
html[data-theme=tokio] .facts div,html[data-theme=tokio] input{background:#16161e}
.ch{height:360px}
.tb select{max-width:230px;padding:4px 6px;font-size:12px;border-radius:6px}
nav button.on,.tb button.on{border-color:var(--blue);background:#1b2740}
.tb{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 8px;align-items:center}
.tb button{padding:4px 9px;font-size:12px;border-radius:6px}
.tb .sp{flex:1}
.card.maxc{position:fixed;inset:0;z-index:50;border-radius:0;overflow:auto;padding:16px}
.card.maxc .ch{height:calc(100vh - 190px)}
.card.maxc details{display:none}
details.max{position:fixed;inset:0;z-index:60;background:var(--card);padding:16px;margin:0;overflow:auto;border:0}
details.max .sc{max-height:none}
body.noscroll{overflow:hidden}
.tx summary{display:flex;gap:8px;align-items:center}
.tx summary .sp{flex:1}
.tx summary button{padding:3px 9px;font-size:12px;border-radius:6px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-top:8px}
.facts div{background:#10141d;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:12px;color:var(--mut)}
.facts b{display:block;color:var(--tx);font-size:13px;font-weight:600;margin-top:2px}
.desc{font-size:13px;line-height:1.55}
.bar{height:10px;background:#10141d;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:var(--up)}
.bar i.warn{background:var(--acc)}.bar i.over{background:var(--dn)}
.tax3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-bottom:14px}
.big{font-size:28px;font-weight:650;font-variant-numeric:tabular-nums}
input[type=date]{background:#10141d;color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:3px 6px;font:inherit;font-size:12px;color-scheme:dark}
input[type=number]{background:#10141d;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;width:100px}
.est{display:inline-block;background:#3a2f12;color:var(--acc);border-radius:5px;padding:1px 6px;font-size:11px;margin-left:6px;vertical-align:middle}
.panel{margin-bottom:14px}
.view{display:none}.view.on{display:block}
.card.maxc .ch{height:calc(100dvh - 230px)}
@media(max-width:700px){
  body{font-size:13px}
  header{padding:8px 10px;gap:6px}
  h1{font-size:15px;width:100%}h1 span{display:block;margin:0;font-size:11px}
  .ctl{width:100%;justify-content:space-between}
  nav button,#reload{padding:6px 9px;font-size:12px}
  main{padding:10px 8px}
  .kpis{grid-template-columns:1fr 1fr;gap:8px}
  .kpi{padding:10px 11px}.kpi .v{font-size:18px}.kpi .l{font-size:10px}.kpi .s{font-size:11px}
  .row{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr;gap:10px}
  .panel{padding:10px 10px}
  .card{padding:10px 8px}
  .tb{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;scrollbar-width:none}
  .tb::-webkit-scrollbar{display:none}
  .tb button,.tb select,.tb input,.tb .small{flex:0 0 auto;white-space:nowrap}
  .tb .sp{display:none}
  .tb [data-a=max]{order:-1}
  .tb button{padding:6px 10px;font-size:12px}
  .ch{height:300px}
  .card.maxc{padding:8px}
  .card.maxc .ch{height:calc(100dvh - 215px)}
  .tx .sc{max-height:260px;-webkit-overflow-scrolling:touch}
  .tx table{font-size:11px}
  .tx td:first-child,.tx th:first-child{position:sticky;left:0;background:var(--card);z-index:1}
  .tx th:first-child{z-index:2}
  .tx summary{flex-wrap:wrap}
  details.max{padding:8px}
  .leg{gap:8px;font-size:11px}
  .tax3{grid-template-columns:1fr}
  .big{font-size:22px}
  .facts{grid-template-columns:1fr 1fr}
  .note{font-size:11px}
  #donut{width:200px;height:200px}
}
@supports(padding:max(0px)){header{padding-top:max(8px,env(safe-area-inset-top))}main{padding-bottom:max(20px,env(safe-area-inset-bottom))}}
.small{font-size:12px;color:var(--mut);line-height:1.6}
</style>
</head>
<body>
<header>
  <h1>Kraken Depot <span id="stand"></span></h1>
  <div class="ctl">
    <nav><button data-v="depot">Depot</button><button data-v="staking">Staking</button><button data-v="steuer">Steuer</button></nav>
    <button id="theme" title="Optik wechseln: Standard oder Tokio (Tokyo Night)">Optik: Standard</button><button id="reload" title="Alle Kurse neu von Kraken laden und alles neu berechnen">↻ Aktualisieren</button>
  </div>
</header>
<main><div id="v-depot" class="view"></div><div id="v-staking" class="view"></div><div id="v-steuer" class="view"></div></main>

function taxCalc(){
  const by={};const add=(coin,e)=>(by[coin]=by[coin]||[]).push(e);
  TRADES.forEach(t=>add(t[1],t[2]>0?{t:t[0],k:0,q:t[2],cost:t[3]+t[4],src:'Kauf'}:{t:t[0],k:1,q:-t[2],proc:t[3]-t[4]}));
  STAKE.forEach(s=>{const p=PX(s[2],s[0]);add(s[2],{t:s[0],k:0,q:s[3],cost:p?s[3]*p:0,src:'Prämie'})});
  BONUS.forEach(s=>{const p=PX(s[1],s[0]);add(s[1],{t:s[0],k:0,q:s[2],cost:p?s[2]*p:0,src:'Bonus'})});
  XFER.forEach(x=>{const p=PX(x[1],x[0]);if(x[2]>0)add(x[1],{t:x[0],k:0,q:x[2],cost:p?x[2]*p:0,src:'Einzahlung'});else add(x[1],{t:x[0],k:2,q:-x[2]+x[3]})});
  const real=[],lots={};
  for(const coin in by){const L=[];
    by[coin].sort((a,b)=>a.t-b.t||a.k-b.k).forEach(e=>{
      if(!e.k){L.push({t:e.t,q:e.q,cost:e.cost,src:e.src});return}
      let need=e.q,cost=0,short=false;const srcs=new Set();
      while(need>1e-12&&L.length){const l=L[0],take=Math.min(l.q,need),part=l.cost*take/l.q;cost+=part;srcs.add(l.src);if(freeFrom(l.t)>e.t)short=true;l.q-=take;l.cost-=part;need-=take;if(l.q<=1e-12)L.shift()}
      if(e.k===2)return;
      const unk=need>e.q*1e-4?need:0;
      real.push({coin,t:e.t,q:e.q,proc:e.proc,cost,gain:e.proc-cost,short:short||unk>0,unk,srcs:[...srcs].join(', ')});
    });
    lots[coin]=L.filter(l=>l.q>1e-10)}
  return {real,lots};
}

function drawDonut(rows,total){

    rows.forEach((r,i)=>{const w=r.mv/total*Math.PI*2;ctx.beginPath();ctx.strokeStyle=palette[i%palette.length];ctx.lineWidth=hi===i?42:34;ctx.arc(130,130,92,a,a+Math.max(w-0.02,0.004));ctx.stroke();seg.push([a,a+w]);a+=w});
    const r=hi==null?null:rows[hi];ctx.fillStyle=cssv('--tx');ctx.textAlign='center';ctx.font='600 20px sans-serif';ctx.fillText(r?r.c:fmt(total,0)+' €',130,126);
    ctx.fillStyle=TH.mut;ctx.font='12px sans-serif';ctx.fillText(r?fmt(r.mv/total*100,1)+' % / '+eur(r.mv):'Krypto',130,148)};
  paint(null);

  cv.onmousemove=e=>{const i=hit(e);if(i<0){tip.style.display='none';paint(null);return}const r=rows[i];paint(i);tip.innerHTML=`<b>${r.c}</b> ${r.name}<br>${fmt(r.mv/total*100,1)} % / ${eur(r.mv)}`;const p=cv.parentNode.getBoundingClientRect();tip.style.display='block';tip.style.left=(e.clientX-p.left+12)+'px';tip.style.top=(e.clientY-p.top+12)+'px'};

  $('#csv2').onclick=()=>csv('kraken-staking-'+Y+'.csv',[['Datum','Coin','Wallet','Menge_netto','Kurs_Zuflusstag_EUR','Wert_Zufluss_EUR'],...COINS.flatMap(c=>stakeRows(c).filter(r=>yearOf(r.t)===Y).map(r=>[dt(r.t),c.c,r.w,num(r.q.toFixed(9)),r.p0==null?'':num(r.p0),r.v0==null?'':num(r.v0.toFixed(6))]))]);
}
function csv(name,rows){const b=new Blob(['﻿'+rows.map(r=>r.join(';')).join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove()}

/* ---------- Steuerung ---------- */
function show(v){if(!['depot','staking','steuer'].includes(v))v='depot';document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));try{history.replaceState(null,'','#'+v)}catch(e){}}
function renderAll(){renderDepot();renderStaking();renderTax()}
async function loadGecko(){try{const r=await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=eur&ids='+COINS.map(c=>c.info.id).join(','));if(!r.ok)return;const j=await r.json();j.forEach(x=>{const c=COINS.find(c=>c.info.id===x.id);if(c)c.live={rank:x.market_cap_rank,mcap:x.market_cap,circ:x.circulating_supply,total:x.total_supply,max:x.max_supply,ath:x.ath,athd:(x.ath_date||'').slice(0,10)}});COINS.forEach(c=>{const e=$('#info-'+c.c);if(e)e.innerHTML=infoHTML(c)})}catch(e){}}
async function loadAll(){
  const first=!COINS.some(c=>c.daily),sy=window.scrollY,rb=$('#reload');rb.disabled=true;rb.textContent='↻ lädt …';
  if(first)renderAll();
  await Promise.all(COINS.map(async c=>{try{c.err=null;c.daily=await fetchOHLC(c.pair,'1440');c.price=c.daily.at(-1).close;c.candles=c.tf==='1440'&&c.cur==='EUR'?c.daily:await loadCandles(c,c.tf)}catch(e){c.err=String(e.message||e)+(e instanceof TypeError?' (Netzwerk oder Browser-Sperre?)':'')}}));
  await Promise.all(Object.entries(AUXP).map(async([k,p])=>{try{AX[k]={daily:await fxC(p,'1440')}}catch(e){}}));
  document.body.classList.remove('noscroll');renderAll();loadGecko();window.scrollTo(0,sy);
  rb.disabled=false;rb.textContent='↻ Aktualisieren';const bad=COINS.filter(c=>c.err).length;
  $('#stand').textContent='Bestand vom '+SNAP+' · Kurse von '+new Date().toLocaleTimeString('de-DE')+(bad?' · '+bad+' Coins ohne neue Kurse':'');
}
document.querySelector('nav').onclick=e=>{const b=e.target.closest('button');if(b)show(b.dataset.v)};
document.addEventListener('click',e=>{const b=e.target.closest('button.mx');if(!b)return;e.preventDefault();const d=b.closest('details');d.open=true;const on=d.classList.toggle('max');document.body.classList.toggle('noscroll',on);b.textContent=on?'⤡ Minimieren':'⤢ Maximieren'});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;document.querySelectorAll('details.max .mx').forEach(b=>b.click());document.querySelectorAll('.card.maxc [data-a=max]').forEach(b=>b.click())});
$('#reload').onclick=loadAll;
$('#theme').onclick=()=>{setTheme(store.get('theme','std')==='tokio'?'std':'tokio');renderAll()};
setTheme(store.get('theme','std'));
show((location.hash||'#depot').slice(1));
loadAll();
</script>
</body>
</html>
